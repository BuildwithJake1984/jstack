name: checks

on:
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          command: config
          globs: |
            **/*.md
            !**/node_modules/**

  links:
    name: links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/lychee /usr/local/bin/lychee
      - name: Check relative links (offline)
        run: |
          mapfile -t files < <(git ls-files '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No markdown files to check."
            exit 0
          fi
          lychee --config lychee.toml --offline --no-progress "${files[@]}"

  frontmatter:
    name: frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate write-up frontmatter
        run: |
          set -euo pipefail
          shopt -s nullglob

          extract_frontmatter() {
            local file="$1"
            awk 'BEGIN{n=0} /^---$/{n++; if(n==1) next; if(n==2) exit} n==1{print}' "$file"
          }

          require_field() {
            local block="$1" field="$2" file="$3"
            echo "$block" | grep -qE "^${field}:" || {
              echo "::error file=${file}::Missing ${field}"
              exit 1
            }
          }

          require_nonempty() {
            local block="$1" pattern="$2" file="$3" label="$4"
            echo "$block" | grep -qE "$pattern" || {
              echo "::error file=${file}::Missing or empty ${label}"
              exit 1
            }
          }

          check_lesson() {
            local f="$1"
            echo "Checking lesson $f"
            local block
            block="$(extract_frontmatter "$f")"
            require_nonempty "$block" '^type:[[:space:]]*lesson\b' "$f" "type: lesson"
            require_field "$block" title "$f"
            require_field "$block" slug "$f"
            require_field "$block" date "$f"
            require_field "$block" status "$f"
            require_field "$block" tags "$f"
            require_field "$block" purpose "$f"
            require_nonempty "$block" '^purpose:\s*.+' "$f" "purpose"
            require_nonempty "$block" '^title:\s*.+' "$f" "title"
            require_nonempty "$block" '^slug:\s*.+' "$f" "slug"
            require_nonempty "$block" '^date:\s*.+' "$f" "date"
            require_nonempty "$block" '^status:\s*.+' "$f" "status"
            if echo "$block" | grep -qE '^status:\s*draft\b'; then
              echo "::error file=$f::Lessons must not use status: draft"
              exit 1
            fi
          }

          check_tool() {
            local f="$1"
            echo "Checking tool $f"
            local block
            block="$(extract_frontmatter "$f")"
            require_nonempty "$block" '^type:\s*tool\b' "$f" "type: tool"
            require_field "$block" title "$f"
            require_field "$block" tags "$f"
            require_field "$block" purpose "$f"
            require_nonempty "$block" '^purpose:\s*.+' "$f" "purpose"
            require_nonempty "$block" '^title:\s*.+' "$f" "title"
          }

          check_skill() {
            local f="$1"
            echo "Checking skill $f"
            local block
            block="$(extract_frontmatter "$f")"
            require_nonempty "$block" '^type:\s*skill\b' "$f" "type: skill"
            require_field "$block" name "$f"
            require_field "$block" description "$f"
            require_field "$block" tags "$f"
            require_field "$block" purpose "$f"
            require_nonempty "$block" '^name:\s*.+' "$f" "name"
            require_nonempty "$block" '^description:\s*.+' "$f" "description"
            require_nonempty "$block" '^purpose:\s*.+' "$f" "purpose"
          }

          lesson_files=(
            ai-agents/lessons/*.md
            design/lessons/*.md
            development/lessons/*.md
          )
          for f in "${lesson_files[@]}"; do
            base="$(basename "$f")"
            if [ "$base" = "README.md" ]; then
              continue
            fi
            if ! head -n 1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::Missing opening frontmatter fence"
              exit 1
            fi
            check_lesson "$f"
          done

          tool_files=(design/tools/*/README.md)
          for f in "${tool_files[@]}"; do
            if ! head -n 1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::Missing opening frontmatter fence"
              exit 1
            fi
            check_tool "$f"
          done

          skill_files=(design/skills/*/SKILL.md ai-agents/skills/*/SKILL.md development/skills/*/SKILL.md)
          for f in "${skill_files[@]}"; do
            if ! head -n 1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::Missing opening frontmatter fence"
              exit 1
            fi
            check_skill "$f"
          done

          echo "Write-up frontmatter OK."

  markdown-only:
    name: markdown-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on disallowed added files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t renamed_to < <(git diff --name-status --diff-filter=R "$BASE_SHA" "$HEAD_SHA" | awk '{print $3}')
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA")
          filtered=()
          for path in "${added[@]}"; do
            skip=0
            for dest in "${renamed_to[@]}"; do
              if [ "$path" = "$dest" ]; then
                skip=1
                break
              fi
            done
            if [ "$skip" -eq 0 ]; then
              filtered+=("$path")
            fi
          done
          added=("${filtered[@]}")
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No newly added files in this PR (excluding rename destinations)."
            exit 0
          fi
          allow() {
            local path="$1"
            case "$path" in
              *.md) return 0 ;;
              .github/*) return 0 ;;
              .markdownlint.jsonc) return 0 ;;
              lychee.toml) return 0 ;;
              LICENSE) return 0 ;;
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.svg) return 0 ;;
              *) return 1 ;;
            esac
          }
          failed=0
          for path in "${added[@]}"; do
            if allow "$path"; then
              echo "OK (allowed): $path"
            else
              echo "::error file=$path::Only markdown and allowlisted config/images may be added in this repo"
              failed=1
            fi
          done
          exit "$failed"
